name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage --reporter=json --outputFile=test-results/unit-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results/unit-results.json
            coverage/coverage-summary.json

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/e2e-results.json

  report:
    runs-on: ubuntu-latest
    needs: [unit-test, e2e-test]
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // --- Parse unit test results ---
            let unitPassed = 0, unitFailed = 0, unitTotal = 0;
            try {
              const unitData = JSON.parse(fs.readFileSync('artifacts/unit-test-results/test-results/unit-results.json', 'utf8'));
              unitPassed = unitData.numPassedTests || 0;
              unitFailed = unitData.numFailedTests || 0;
              unitTotal = unitData.numTotalTests || 0;
            } catch (e) {
              console.log('Unit test results not found:', e.message);
            }

            // --- Parse coverage ---
            let coverageLines = '-', coverageBranches = '-', coverageFunctions = '-', coverageStatements = '-';
            try {
              const covData = JSON.parse(fs.readFileSync('artifacts/unit-test-results/coverage/coverage-summary.json', 'utf8'));
              const total = covData.total;
              coverageLines = total.lines.pct + '%';
              coverageBranches = total.branches.pct + '%';
              coverageFunctions = total.functions.pct + '%';
              coverageStatements = total.statements.pct + '%';
            } catch (e) {
              console.log('Coverage data not found:', e.message);
            }

            // --- Parse E2E test results ---
            let e2ePassed = 0, e2eFailed = 0, e2eTotal = 0;
            try {
              const e2eData = JSON.parse(fs.readFileSync('artifacts/e2e-test-results/e2e-results.json', 'utf8'));
              for (const suite of e2eData.suites || []) {
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    e2eTotal++;
                    if (test.status === 'expected') e2ePassed++;
                    else e2eFailed++;
                  }
                }
              }
            } catch (e) {
              console.log('E2E test results not found:', e.message);
            }

            const unitIcon = unitFailed > 0 ? '❌' : (unitTotal > 0 ? '✅' : '⚠️');
            const e2eIcon = e2eFailed > 0 ? '❌' : (e2eTotal > 0 ? '✅' : '⚠️');

            const body = `## 🧪 テスト結果レポート

            ### Unit Tests ${unitIcon}

            | 項目 | 結果 |
            |------|------|
            | 成功 | ${unitPassed} / ${unitTotal} |
            | 失敗 | ${unitFailed} |

            #### カバレッジ

            | 指標 | カバレッジ |
            |------|-----------|
            | Statements | ${coverageStatements} |
            | Branches | ${coverageBranches} |
            | Functions | ${coverageFunctions} |
            | Lines | ${coverageLines} |

            ### E2E Tests ${e2eIcon}

            | 項目 | 結果 |
            |------|------|
            | 成功 | ${e2ePassed} / ${e2eTotal} |
            | 失敗 | ${e2eFailed} |

            ---
            🤖 *自動生成 by GitHub Actions*`.replace(/^            /gm, '');

            // Delete old comments from this bot
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments) {
              if (comment.body.includes('🧪 テスト結果レポート')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Post new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  build:
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate
